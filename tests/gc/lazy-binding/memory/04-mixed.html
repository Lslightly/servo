<!DOCTYPE html>
<html>
<body>
<!-- 静态子树：解析器建立 stub，JS 永不访问（既不在基线增量里，也不参与删除）。 -->
<div id="static-host"><div><div></div><div></div></div></div>
<div id="js-host"></div>
<div id="parser-host"></div>
<script src="mb.js"></script>
<script>
  // 三种来源的节点同时存在：
  //   - 静态标记里的子树（stub 保持未物化）
  //   - JS `createElement` 创建的节点（JSObject）
  //   - `insertAdjacentHTML` 解析出的节点（stub），其中查询一个使其物化
  //
  // 断言（计数由 `runtime.memory_usage()` 一次堆遍历给出的
  // [objects, objectBytes, stubs, stubBytes] 读取，比较在页面内完成）：
  //   base -> after-js            : obj_count 约 +N_JS，dom_stub_count 不变
  //   after-js -> after-parser    : dom_stub_count 约 +N_PARSER，obj_count 基本不变
  //   after-parser -> after-query : 查询一个解析节点，obj_count 约 +1，dom_stub_count 约 -1
  //   deleted vs base             : 删除后换到下一个任务 GC，两者都回到基线
  //                                 （静态子树的 stub 从未变化）
  // 计数允许 ±2（字节 ±128）的浮动：GC 可能顺带回收/创建其它小对象。
  var runtime = window.runtime;
  document.getElementById("static-host");
  var jsHost = document.getElementById("js-host");
  var parserHost = document.getElementById("parser-host");

  // 预热 createElement 与 parser 两条路径。返回值立刻置 null，否则它持有的
  // wrapper 会让节点活到下一次快照。
  var warm = document.createElement("div");
  var tmp = jsHost.appendChild(warm);
  tmp = null;
  tmp = jsHost.removeChild(warm);
  tmp = null;
  parserHost.insertAdjacentHTML("beforeend", "<div></div>");
  parserHost.innerHTML = "";
  warm = null;
  void jsHost.offsetWidth;
  runtime.drain_pool_gc();

  var N_JS = 50;
  var N_PARSER = 70;
  // 全部在基线之前分配：nodes 数组和五个快照记录本身就是 JSObject。
  var nodes = [];
  var base = MB.record();
  var afterMixed = MB.record();
  var deleted = MB.record();

  // 解析用的 HTML 在基线之前拼好，避免字符串分配混进测量区间。
  var html = '<div id="parsed-root"></div>';
  for (var i = 1; i < N_PARSER; i++) {
    html += "<div></div>";
  }

  function collect() {
    // 换到下一个任务再 GC：同一任务里 `drain_pool_gc()` 回收不到解析留下的 fragment
    // 记账对象。
    runtime.drain_pool_gc();
    MB.counts(deleted); // 增加ArrayObject

    // mixed 快照：JS 创建的 N_JS 个 JSObject + 查询物化的 1 个解析节点；+ MB.counts
    // 解析出的 N_PARSER 个 stub（其中 1 个已物化）。两类计数同时在一个范围内。
    MB.expectRange("mixed: JSObject 数量", N_JS + 1, N_JS + 6, MB.delta(afterMixed, base, "objects"));
    MB.expectRange("mixed: dom stub 数量", N_PARSER - 2, N_PARSER + 3, MB.delta(afterMixed, base, "stubs"));

    MB.expectRange("删除后 obj_count 回到基线", -2, 2, MB.delta(deleted, base, "objects"));
    MB.expectRange("删除后 dom_stub_count 回到基线", -1, 1, MB.delta(deleted, base, "stubs"));

    MB.finish("04-mixed");
  }

  // 基线也在下一个任务里取：warm-up 解析留下的 fragment 记账对象要等换任务后的 GC
  // 才释放，这样基线和删除后的测量是同一口径。
  window.setTimeout(function () {
    runtime.drain_pool_gc();
    MB.counts(base);

    // (1) 纯 JS：createElement 直接产生 JSObject。
    for (var i = 0; i < N_JS; i++) {
      var node = document.createElement("div");
      nodes.push(node);
      tmp = jsHost.appendChild(node);
      tmp = null;
    }
    node = null;

    // (2) 解析器：每个元素一个 stub，第一个带 id 供查询。
    parserHost.insertAdjacentHTML("beforeend", html);

    // (3) 只查询一个解析节点：物化它，释放它的 stub。
    var parsedRoot = document.getElementById("parsed-root");
    MB.counts(afterMixed);

    // 删除：JS 创建的节点逐个移除，解析节点整体清空；静态子树保持不动。
    for (var i = 0; i < N_JS; i++) {
      tmp = jsHost.removeChild(nodes[i]);
      tmp = null;
    }
    nodes = null;
    parsedRoot = null;
    parserHost.innerHTML = "";
    void jsHost.offsetWidth;
    void parserHost.offsetWidth;
    window.setTimeout(collect, 100);
  }, 100);
</script>
</body>
</html>
