<!DOCTYPE html>
<html>
<body>
<div id="host"></div>
<script src="lb.js"></script>
<script>
  // Minimal case: the parser creates a chain of `total` divs that JS never touches, the chain is
  // detached without handing any node to JS, and a single drain + GC should reclaim the stubs.
  var runtime = window.runtime;
  var doc = document;
  var total = 5;

  // `getElementById` materializes the host's own stub before counting starts.
  var host = doc.getElementById("host");

  var html = "";
  for (var i = 0; i < total; i++) {
    html += "<div>";
  }
  for (var i = 0; i < total; i++) {
    html += "</div>";
  }

  var before = runtime.dom_stub_count();
  // `insertAdjacentHTML` hands no node to JS, unlike `createElement`.
  host.insertAdjacentHTML("beforeend", html);
  var attached = runtime.dom_stub_count();
  console.log("JSDomStubs added by the parser:", attached - before);
  LB.expectTrue(
    "the parser creates at least one JSDomStub per never-accessed element",
    attached - before >= total
  );

  // Detach without handing a node to JS: `replaceChildren()` returns `undefined`.
  host.replaceChildren();
  LB.expect("replaceChildren() leaves the host empty", 0, host.childNodes.length);

  // Layout still holds the detached nodes until it recomputes; reading offsetWidth forces that
  // reflow, after which the subtree is unreachable from both JS and layout.
  void host.offsetWidth;

  runtime.drain_pool_gc();
  runtime.dump_freed_dom_stubs();
  var after = runtime.dom_stub_count();
  console.log("stubs: insert=" + attached + " after=" + after);

  // Diagnostic only, and deliberately after the measurement because it materializes the node if
  // one is still reachable: a stale `last_child` (or any other child pointer) on the host would
  // keep the detached chain reachable for the GC even though `childNodes.length` is 0.
  console.log(
    "host.firstChild=" + host.firstChild +
    " host.lastChild=" + host.lastChild +
    " host.firstElementChild=" + host.firstElementChild +
    " host.lastElementChild=" + host.lastElementChild
  );

  LB.expect(
    "QuickJS GC reclaims the stubs of the detached, never-accessed subtree",
    total,
    attached - after
  );
  LB.finish("15-detached-subtree-stub-gc");
</script>
</body>
</html>
