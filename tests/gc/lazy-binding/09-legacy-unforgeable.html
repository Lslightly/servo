<!DOCTYPE html>
<html>
<body>
<script src="lb.js"></script>
<script>
  // Warm-up: Document itself is lazy too.
  var doc = document;
  window.runtime.reset_materialize_stats();

  // `Event.isTrusted` is [LegacyUnforgeable]: it lives on the interface's
  // unforgeable holder, not on the prototype. Materialization copies those
  // properties onto the new instance; if it did not, the property would be
  // missing from the object.
  var event = new Event("test");
  LB.expect(
    "constructing an Event materializes it",
    0,
    window.runtime.materialize_count()
  );
  LB.expectTrue(
    "LegacyUnforgeable isTrusted was copied onto the materialized instance",
    event.isTrusted === false
  );
  LB.expectTrue(
    "isTrusted is an own property after materialization",
    Object.prototype.hasOwnProperty.call(event, "isTrusted")
  );

  void event;
  LB.finish("09-legacy-unforgeable");
</script>
</body>
</html>
