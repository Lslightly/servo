<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      html, body { margin: 0; padding: 0; }
      .item { height: 30px; line-height: 30px; border-bottom: 1px solid #eee; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      /*
       * 目的：在 17-batch-remove-drain 的基础上，把显式的 drain_pool 换成
       * drain_pool_gc（drain pool + 一次完整 GC，记成一条合计耗时），
       * 看「批量删节点 + GC」的总成本随节点数怎么增长。
       *
       * 流程，每个尺寸：
       *   1. 建树：创建一棵 n 个节点的子树（1 个根 + n-1 个子节点），
       *      挂到父节点上，然后把 JS 侧的引用置空；
       *   2. reflow + drain_pool_gc：清掉建树留下的 pool 记录；
       *   3. 下树：一次 `stage.textContent = "removed"` 摘掉整棵子树；
       *   4. reflow：读一次 offsetHeight 强制布局；
       *   5. drain_pool_gc：drain pool，再跑一次 GC，把靠树边相互引用的
       *      子树节点一起回收。
       * 每个尺寸重复 REPEATS（30）次，每次单独占一个 task。
       *
       * 重要：drain_pool_gc 里的 drain 部分通常是空的。
       *   `stage.textContent = "..."` 这个 native call 返回时，引擎已经用
       *   ctx=native_call 把 Deferred 排空了（见 17 的注释）。从 JS 调用的
       *   drain_pool_gc 本身也是一个 native call，它内部 drain 时 pool 已经空，
       *   所以 ctx=drain_pool_gc 那条的 elapsed_ns 基本就是 GC 的耗时。
       *   想分开看：同一次运行里，ctx=native_call、values ≈ N 的那条是 drain，
       *   ctx=drain_pool_gc 那条是 GC。
       *
       * 计时口径：
       *   页面里不做任何计时。DRAIN_STATS=1 时，drain_pool_gc 写一条
       *   ctx=drain_pool_gc 的记录，elapsed_ns 是 drain + GC 的合计；
       *   empty 字段为 0 表示这条记录计了时（drain_pool_gc 总会跑 GC，所以总是计时）。
       *
       * 运行示例：
       *   DRAIN_STATS=1 QJS_DRAIN_STATS_OUT=drains.jsonl \
       *     ./servoshell tests/gc/18-remove-subtree-drain-and-gc.html
       */

      const SIZES = [10, 20, 50, 100, 200, 500, 1000, 2000];
      const REPEATS = 30;             // 每个尺寸跑 30 次，每次单独占一个 task
      const AUTO_CLOSE = true;

      const stage = document.getElementById("stage");

      function forceReflow() {
        // 读一次布局属性，强制走完一次 reflow。
        void document.body.offsetHeight;
      }

      function makeSubTrees(n) {
        // 一棵 n 个节点的子树：1 个根节点 + (n-1) 个子节点。
        // 子节点都挂在根下面，整棵子树靠 DOM 树边相互引用。
        const root = document.createElement("div");
        for (let i = 1; i < n; i++) {
          const child = document.createElement("div");
          child.className = "item";       // 不设 textContent：避免多一个 Text 子节点
          root.appendChild(child);
        }
        return root;
      }

      function runSize(size, repeat) {
        // 建树：创建一棵 n 个节点的子树，然后挂到父节点（stage）上。
        let subtree = makeSubTrees(size);
        let tmp = stage.appendChild(subtree);
        // 挂好之后丢掉 JS 侧的引用，子树只剩 DOM 树边这一份。
        subtree = null;
        tmp = null;

        // 建树本身也会往 pool 里塞值，先清掉，避免混进下树那次。
        // 这里用 drain_pool_gc 而不是 drain_pool：同样清空 pool，并顺带
        // 跑一次 GC，建树留下的不可达对象不会留到下一次测量。
        forceReflow();
        runtime.drain_pool_gc();

        // 1. 下树：一次 native call 从父节点摘掉整棵子树。
        //    每条树边读到 rc == 1 → 全部进 Deferred，在这个 native call
        //    返回时以 ctx=native_call 排空。
        stage.textContent = "removed";

        // 2. reflow：布局侧若有 Dom 句柄，最后一份引用会在这里释放。
        forceReflow();

        // 3. drain_pool_gc：子树内部节点相互引用、又没有外部根了，
        //    这次 GC 把它们一起回收。
        runtime.drain_pool_gc();

        console.log("[batch-remove-gc] size =", size, "repeat =", repeat,
                    "values_expected =", size);
      }

      let next = 0;     // 当前尺寸在 SIZES 中的下标
      let repeat = 0;   // 当前尺寸已经跑过的次数

      function step() {
        if (next >= SIZES.length) {
          console.log(
            "[batch-remove-gc] 看 DRAIN_STATS：ctx=drain_pool_gc 的 elapsed_ns 是" +
            "本次 drain + GC 的合计；ctx=native_call、values ≈ size 的那条是纯 drain"
          );
          if (AUTO_CLOSE) {
            setTimeout(() => window.close(), 2000);
          }
          return;
        }
        runSize(SIZES[next], repeat);
        // 每个尺寸跑 REPEATS 次，每次单独占一个 task，让上一次的残留 drain 先结束。
        if (++repeat >= REPEATS) {
          repeat = 0;
          next++;
        }
        setTimeout(step, 0);
      }

      step();
    </script>
  </body>
</html>
